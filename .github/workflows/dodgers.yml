name: Dodgers Notifier

on:
  schedule:
    # GitHub cron is UTC only (no timezone support).
    # 16:00 UTC = 9:00 AM Pacific during PDT (the baseball season).
    - cron: "0 16 * * *"

  # Lets you manually test it from GitHub
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Dodgers notifier
        run: python check_dodgers_win.py
