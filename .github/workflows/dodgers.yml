name: Dodgers Notifier

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "America/Los_Angeles"

  # Lets you manually test it from GitHub
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Dodgers notifier
        run: python check_dodgers_win.py
